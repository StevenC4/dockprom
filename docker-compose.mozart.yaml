networks:
  smtp-net:
    external: true
  # Created once by homelab-slack-gateway (`make net`). alert-ack joins it to receive the
  # Resolve clicks the gateway unicasts under the `alert:` namespace.
  homelab-slack:
    external: true

volumes:
  grafana_data: {}
  # The ts of every alert post alert-ack makes. Durable because a lost ts means a post that can
  # never be marked resolved — see alert-ack/alert_ack/store.py.
  alert_ack_data: {}

services:
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - "--web.external-url=https://alertmanager.local"
    restart: unless-stopped
    ports:
      - "9093:9093"
    expose:
      - 9093
    networks:
      - home-reverse-proxy-net
      - monitor-net
      - smtp-net
    labels:
      - monitor_group=monitoring
      - homepage.group=Util
      - homepage.name=Alert Manager
      - homepage.icon=alertmanager
      - homepage.href=https://alertmanager.carroll.live
      - homepage.description=Alert Manager client
      - traefik.enable=true
      - traefik.docker.network=home-reverse-proxy-net
      - traefik.http.routers.alertmanager.rule=Host(`alertmanager.carroll.live`) || Host(`alertmanager.stevenc4.com`)
      - traefik.http.routers.alertmanager.entrypoints=websecure
      - traefik.http.routers.alertmanager.middlewares=auth
      - traefik.http.middlewares.auth.basicauth.users=steven:$$2y$$05$$1ZYT5NkVLiQETZI6b86MSOn8TfOrKmkvMZgmf7Rmx2Q2YNsxXOU9a
      - traefik.http.routers.alertmanager.tls.certresolver=carroll_live_dns_resolver
      - traefik.http.services.alertmanager.loadbalancer.server.port=9093
      - coredns.enabled=true
      - coredns.a.1.name=alertmanager.carroll.live
      - coredns.a.2.name=alertmanager.stevenc4.com
      - coredns.aaaa.1.name=alertmanager.carroll.live
      - coredns.aaaa.2.name=alertmanager.stevenc4.com

  cadvisor:
    deploy:
      resources:
        limits:
          # 85 containers on this host: the old 0.5 CPU / 256m caps left cAdvisor
          # throttled in 87% of CFS periods and pinned at its memory ceiling, so
          # /metrics could not render inside Prometheus' scrape timeout.
          cpus: "2"
          memory: "1g"

  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    env_file:
      - ./env/grafana.env
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    expose:
      - 3000
    ports:
      - "3001:3000"
    networks:
      - monitor-net
      - home-reverse-proxy-net
    labels:
      - monitor_group=monitoring
      - homepage.group=Util
      - homepage.name=Grafana
      - homepage.icon=grafana
      - homepage.href=https://grafana.carroll.live
      - homepage.description=Grafana client
      - traefik.enable=true
      - traefik.docker.network=home-reverse-proxy-net
      - traefik.http.routers.grafana.rule=Host(`grafana.carroll.live`) || Host(`grafana.stevenc4.com`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=carroll_live_dns_resolver
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - coredns.enabled=true
      - coredns.a.1.name=grafana.carroll.live
      - coredns.a.2.name=grafana.stevenc4.com
      - coredns.aaaa.1.name=grafana.carroll.live
      - coredns.aaaa.2.name=grafana.stevenc4.com

  ofelia-dockprom:
    container_name: ofelia-dockprom
    image: mcuadros/ofelia:latest
    command: daemon --config=/opt/config.ini
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ofelia/mozart:/opt
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.6.0
    container_name: pushgateway
    restart: unless-stopped
    expose:
      - 9091
    ports:
      - "9091:9091"
    networks:
      - monitor-net
    labels:
      monitor_group: monitoring

  # The Resolve button on #alerts posts. A Slack interactivity backend behind
  # homelab-slack-gateway: the gateway holds the workspace's one app token and unicasts
  # `alert:` clicks here over signed HTTP, and this marks the post resolved with chat.update.
  #
  # It is NOT in the alerting path. Alertmanager still posts through its own incoming webhook,
  # so if this container is down or missing, alerts arrive exactly as before and only the
  # button stops working. That is why the button hangs off the webhook post rather than this
  # service posting the alert — see the note on the nh22-slack receiver in alertmanager/config.yml.
  #
  # NOTE the missing `ports:`. It listens on 8084 on the private `homelab-slack` network only
  # and is never published to the host — the HMAC is defense in depth, not the only defense.
  alert-ack:
    container_name: alert-ack
    build:
      context: ./alert-ack
    restart: unless-stopped
    # SLACK_BOT_TOKEN (xoxb-, shared with the other backends) and HOMELAB_GATEWAY_SECRET (the
    # same value the gateway signs with, or it will 401 us). env/ is gitignored; see the README.
    env_file: ./env/alert-ack.env
    volumes:
      - alert_ack_data:/data
    networks:
      homelab-slack:
        aliases:
          - alert-ack-backend   # the name the gateway's routes.yaml dials
      # Alertmanager lives on monitor-net and posts alerts here now, so alert-ack has to be
      # reachable from it. Before auto-resolve this container was on homelab-slack ONLY, which is
      # why the two could not talk: alerts went straight from Alertmanager to Slack's incoming
      # webhook and this service never saw them.
      monitor-net:
    labels:
      - com.centurylinklabs.watchtower.enable=false

  zfs-utils:
    container_name: zfs-utils
    build:
      context: ./zfs-utils
    privileged: true
    # Must stay running so ofelia-dockprom can exec gather-zfs-metrics.sh into it.
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /dev:/dev:ro
      - ./textfile_collector:/zfs-metrics
    labels:
      - com.centurylinklabs.watchtower.enable=false

  # Liveness for the scheduled one-shot job containers across every stack on this host.
  #
  # Ofelia has no metrics endpoint, so a job that stops firing altogether is invisible — the
  # exact shape of the July 2026 outage, where a `docker system prune` removed the exited
  # one-shots and every tick failed with "No such container" for 9 days with no signal. This
  # reads what Docker already knows about each container (exists / running / finished when /
  # exit code) and publishes it, so no job has to be modified to be monitored.
  #
  # It deliberately does NOT run under ofelia-dockprom like the zfs and watchtower collectors:
  # a monitor that depends on a scheduler cannot be trusted to report that scheduler's failure.
  # It self-loops instead, and its own death is caught by node_textfile_mtime_seconds going
  # stale (see the scheduled-jobs alert group).
  oneshot-exporter:
    container_name: oneshot-exporter
    build:
      context: ./oneshot-exporter
    restart: unless-stopped
    environment:
      ONESHOT_INTERVAL: "60"
      # container|max_age_seconds|service
      #
      # max_age is a STALENESS BUDGET, not the schedule: it must exceed the largest legitimate
      # gap between runs, including overnight backoff and windowed schedules, or the alert
      # flaps every night. It is emitted as a metric so one generic rule serves every job —
      # a monthly report and a 15-minute poll cannot share a threshold.
      #
      # THIS FILE IS COUPLED TO SCHEDULES THAT LIVE IN OTHER REPOS. Every budget below is
      # derived from an Ofelia schedule in nighthawk22-analytics, garmin-analytics, garmin-jobs,
      # receipt-hopper, finance-jobs or vpn. Nothing enforces the link, so **changing a job's
      # cadence in its own repo requires changing its budget here in the same breath**. This is
      # not hypothetical: configarr was moved from @every 15s to @every 15m in vpn, which left a
      # 300s budget tighter than the schedule itself and made OneShotJobStale flap permanently.
      #
      # `service` selects the Alertmanager route. Everything here lands on the default `email`
      # receiver; vpn-jobs has an explicit route saying so, because that was asked for by name.
      ONESHOT_TARGETS: |
        nh22-analytics-importer-1|10800|nh22-jobs
        nh22-analytics-processor-1|10800|nh22-jobs
        nh22-analytics-extractor-1|108000|nh22-jobs
        # Daily 05:30 MT (ofelia "extract-ascap"). 30h covers the DST-shifted gap between two
        # runs; a quarterly source cannot justify anything tighter.
        nh22-analytics-extractor-ascap-1|108000|nh22-jobs
        # probe-cdbaby was retired 2026-08-01 (nighthawk22-analytics ac9ad85) and its watchlist
        # entry removed 2026-08-02 — one day too late. In between, OneShotJobContainerMissing
        # fired every 2h against a container that was deleted on purpose, exactly as the note
        # here warned it would. The lesson is the one at the top of this block: this file is
        # coupled to schedules in other repos, and retiring a job means editing BOTH in the
        # same breath. A deletion needs that discipline as much as a cadence change does.
        garmin-analytics-ingest|7200|garmin-jobs
        garmin-workout-progression|28800|garmin-jobs
        garmin-running-shoe-rotation|28800|garmin-jobs
        garmin-treadmill-calorie-correction|28800|garmin-jobs
        garmin-fitness-report-weekly|777600|garmin-jobs
        garmin-fitness-report-monthly|3024000|garmin-jobs
        hopper-gmail|3600|hopper-jobs
        luiz-car-loan|50400|finance-jobs
        configarr|2700|vpn-jobs

      # The schedulers that START everything above. "container|service", no budget — a daemon
      # is either up or it is not.
      #
      # This is the CAUSE side of the same outage the budgets above catch by effect. On
      # 2026-07-31 nh22-analytics-ofelia-1 exited 1 on an unparseable config having scheduled
      # nothing; OneShotJobStale reported the importer and processor late 3.5h later, which was
      # correct but described two symptoms rather than one cause. It also covers the two cases
      # the budgets structurally cannot: a scheduler that dies while every job is still inside
      # its budget, and one that crash-loops without ever running anything.
      #
      # Every ofelia on this host is listed, not just nh22's — they all fail the same way, and
      # the one that is missing from this list is the one whose outage is invisible.
      SCHEDULER_TARGETS: |
        nh22-analytics-ofelia-1|nh22-jobs
        ofelia-dockprom|monitoring
        ofelia-arr|vpn-jobs
        ofelia-mcps|mcp-jobs
        hopper-ofelia|hopper-jobs
        finance-ofelia|finance-jobs
    volumes:
      # Read-only: this only ever inspects. It never starts, stops or creates anything, which
      # is what lets it hold the socket without being another way to mutate the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./textfile_collector:/textfile_collector
    labels:
      monitor_group: monitoring
      com.centurylinklabs.watchtower.enable: "false"
