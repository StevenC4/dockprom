networks:
  smtp-net:
    external: true

volumes:
  grafana_data: {}

services:
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - "--web.external-url=https://alertmanager.local"
    restart: unless-stopped
    ports:
      - "9093:9093"
    expose:
      - 9093
    networks:
      - home-reverse-proxy-net
      - monitor-net
      - smtp-net
    labels:
      - monitor_group=monitoring
      - homepage.group=Util
      - homepage.name=Alert Manager
      - homepage.icon=alertmanager
      - homepage.href=https://alertmanager.carroll.live
      - homepage.description=Alert Manager client
      - traefik.enable=true
      - traefik.docker.network=home-reverse-proxy-net
      - traefik.http.routers.alertmanager.rule=Host(`alertmanager.carroll.live`) || Host(`alertmanager.stevenc4.com`)
      - traefik.http.routers.alertmanager.entrypoints=websecure
      - traefik.http.routers.alertmanager.middlewares=auth
      - traefik.http.middlewares.auth.basicauth.users=steven:$$2y$$05$$1ZYT5NkVLiQETZI6b86MSOn8TfOrKmkvMZgmf7Rmx2Q2YNsxXOU9a
      - traefik.http.routers.alertmanager.tls.certresolver=carroll_live_dns_resolver
      - traefik.http.services.alertmanager.loadbalancer.server.port=9093
      - coredns.enabled=true
      - coredns.a.1.name=alertmanager.carroll.live
      - coredns.a.2.name=alertmanager.stevenc4.com
      - coredns.aaaa.1.name=alertmanager.carroll.live
      - coredns.aaaa.2.name=alertmanager.stevenc4.com

  cadvisor:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256m"

  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    env_file:
      - ./env/grafana.env
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    expose:
      - 3000
    ports:
      - "3001:3000"
    networks:
      - monitor-net
      - home-reverse-proxy-net
    labels:
      - monitor_group=monitoring
      - homepage.group=Util
      - homepage.name=Grafana
      - homepage.icon=grafana
      - homepage.href=https://grafana.carroll.live
      - homepage.description=Grafana client
      - traefik.enable=true
      - traefik.docker.network=home-reverse-proxy-net
      - traefik.http.routers.grafana.rule=Host(`grafana.carroll.live`) || Host(`grafana.stevenc4.com`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=carroll_live_dns_resolver
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - coredns.enabled=true
      - coredns.a.1.name=grafana.carroll.live
      - coredns.a.2.name=grafana.stevenc4.com
      - coredns.aaaa.1.name=grafana.carroll.live
      - coredns.aaaa.2.name=grafana.stevenc4.com

  ofelia-dockprom:
    container_name: ofelia-dockprom
    image: mcuadros/ofelia:latest
    command: daemon --config=/opt/config.ini
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ofelia/mozart:/opt
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.6.0
    container_name: pushgateway
    restart: unless-stopped
    expose:
      - 9091
    ports:
      - "9091:9091"
    networks:
      - monitor-net
    labels:
      monitor_group: monitoring

  zfs-utils:
    container_name: zfs-utils
    build:
      context: ./zfs-utils
    privileged: true
    # Must stay running so ofelia-dockprom can exec gather-zfs-metrics.sh into it.
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /dev:/dev:ro
      - ./textfile_collector:/zfs-metrics
    labels:
      - com.centurylinklabs.watchtower.enable=false

  # Liveness for the scheduled one-shot job containers across every stack on this host.
  #
  # Ofelia has no metrics endpoint, so a job that stops firing altogether is invisible — the
  # exact shape of the July 2026 outage, where a `docker system prune` removed the exited
  # one-shots and every tick failed with "No such container" for 9 days with no signal. This
  # reads what Docker already knows about each container (exists / running / finished when /
  # exit code) and publishes it, so no job has to be modified to be monitored.
  #
  # It deliberately does NOT run under ofelia-dockprom like the zfs and watchtower collectors:
  # a monitor that depends on a scheduler cannot be trusted to report that scheduler's failure.
  # It self-loops instead, and its own death is caught by node_textfile_mtime_seconds going
  # stale (see the scheduled-jobs alert group).
  oneshot-exporter:
    container_name: oneshot-exporter
    build:
      context: ./oneshot-exporter
    restart: unless-stopped
    environment:
      ONESHOT_INTERVAL: "60"
      # container|max_age_seconds|service
      #
      # max_age is a STALENESS BUDGET, not the schedule: it must exceed the largest legitimate
      # gap between runs, including overnight backoff and windowed schedules, or the alert
      # flaps every night. It is emitted as a metric so one generic rule serves every job —
      # a monthly report and a 15-minute poll cannot share a threshold.
      #
      # `service` selects the Alertmanager route. Everything here lands on the default `email`
      # receiver; vpn-jobs has an explicit route saying so, because that was asked for by name.
      ONESHOT_TARGETS: |
        nh22-analytics-importer-1|10800|nh22-jobs
        nh22-analytics-processor-1|10800|nh22-jobs
        nh22-analytics-extractor-1|108000|nh22-jobs
        garmin-analytics-ingest|7200|garmin-jobs
        garmin-workout-progression|28800|garmin-jobs
        garmin-running-shoe-rotation|28800|garmin-jobs
        garmin-treadmill-calorie-correction|28800|garmin-jobs
        garmin-fitness-report-weekly|777600|garmin-jobs
        garmin-fitness-report-monthly|3024000|garmin-jobs
        hopper-gmail|3600|hopper-jobs
        luiz-car-loan|50400|finance-jobs
        configarr|300|vpn-jobs
    volumes:
      # Read-only: this only ever inspects. It never starts, stops or creates anything, which
      # is what lets it hold the socket without being another way to mutate the host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./textfile_collector:/textfile_collector
    labels:
      monitor_group: monitoring
      com.centurylinklabs.watchtower.enable: "false"
