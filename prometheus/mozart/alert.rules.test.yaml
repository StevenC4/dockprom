# promtool unit tests for the rules that have a "fires when nothing is wrong" failure mode.
#
# Not every rule is covered here and that is deliberate — these three are the ones where the
# alert's correctness depends on a GATE rather than on a threshold, and a gate is exactly the
# thing that looks redundant to a later reader and gets simplified away. Each test therefore
# asserts BOTH directions: silent on the healthy state that previously paged, and still firing
# on the fault the rule exists to catch. A test that only asserted silence would be passed
# perfectly by a rule that had been deleted.
#
# Run: make test-alert-rules
rule_files:
  - alert.rules

evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------------
  # NH22CdbabyReauthReminderUndelivered
  #
  # delivery_success is 0 on a quiet run as well as a failed one, so the rule is only correct
  # because of the post_attempted conjunct. Observed live on 2026-08-06: band=0 with 29 days
  # of credential left, and delivery_success=0 — the ungated rule would have paged on that.
  # ---------------------------------------------------------------------------
  - interval: 1m
    name: reminder ran with nothing to say - must stay silent
    input_series:
      - series: 'nh22_cdbaby_reauth_reminder_post_attempted'
        values: '0x60'
      - series: 'nh22_cdbaby_reauth_reminder_delivery_success'
        values: '0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: NH22CdbabyReauthReminderUndelivered
        exp_alerts: []

  - interval: 1m
    name: reminder tried to post and Slack refused - must fire
    input_series:
      - series: 'nh22_cdbaby_reauth_reminder_post_attempted'
        values: '1x60'
      - series: 'nh22_cdbaby_reauth_reminder_delivery_success'
        values: '0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: NH22CdbabyReauthReminderUndelivered
        exp_alerts:
          - exp_labels:
              severity: critical
              service: nh22-extractor
              kind: auth
            exp_annotations:
              summary: "nh22 cdbaby reauth reminder could not deliver its warning"
              description: "The reminder decided the CD Baby credential needs attention and failed to post it to Slack. The warning that a ~30-day credential is expiring has been produced and thrown away — nobody has been told, and the next sign will be a crawl failing on dead auth."
              runbook: "`docker logs nh22-analytics-reauth-reminder-cdbaby-1` names the exact cause. not_in_channel: `/invite` the bot to the channel. invalid_auth/token_revoked or an unset token: fix SLACK_BOT_TOKEN in nighthawk22-analytics/.env. Then check the credential by hand — `nh22_cdbaby_reauth_reminder_seconds_left` says how long is left — and re-auth via `make reauth SOURCE=cdbaby` if it is short."

  - interval: 1m
    name: reminder posted successfully - must stay silent
    input_series:
      - series: 'nh22_cdbaby_reauth_reminder_post_attempted'
        values: '1x60'
      - series: 'nh22_cdbaby_reauth_reminder_delivery_success'
        values: '1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: NH22CdbabyReauthReminderUndelivered
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # OneShotJobNeverRan
  #
  # Docker resets FinishedAt on recreation, so last_finish=0 is ambiguous on its own. The gate
  # is container age against the job's own budget. Both jobs below look identical through
  # last_finish; only the second one is a fault.
  # ---------------------------------------------------------------------------
  - interval: 1m
    name: monthly report recreated well inside its budget - must stay silent
    input_series:
      - series: 'oneshot_job_present{container="garmin-fitness-report-monthly",service="garmin-jobs"}'
        values: '1x300'
      - series: 'oneshot_job_last_finish_seconds{container="garmin-fitness-report-monthly",service="garmin-jobs"}'
        values: '0x300'
      - series: 'oneshot_job_created_seconds{container="garmin-fitness-report-monthly",service="garmin-jobs"}'
        values: '0x300'
      - series: 'oneshot_job_max_age_seconds{container="garmin-fitness-report-monthly",service="garmin-jobs"}'
        values: '3024000x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: OneShotJobNeverRan
        exp_alerts: []

  - interval: 1m
    name: job that has existed far past its budget without ever running - must fire
    input_series:
      - series: 'oneshot_job_present{container="hopper-gmail",service="hopper-jobs"}'
        values: '1x300'
      - series: 'oneshot_job_last_finish_seconds{container="hopper-gmail",service="hopper-jobs"}'
        values: '0x300'
      - series: 'oneshot_job_created_seconds{container="hopper-gmail",service="hopper-jobs"}'
        values: '0x300'
      - series: 'oneshot_job_max_age_seconds{container="hopper-gmail",service="hopper-jobs"}'
        values: '3600x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: OneShotJobNeverRan
        exp_alerts:
          - exp_labels:
              severity: warning
              container: hopper-gmail
              service: hopper-jobs
            exp_annotations:
              summary: "Scheduled job hopper-gmail has never run"
              description: "'hopper-gmail' (hopper-jobs) exists but has no completed run, and has now existed for longer than its own staleness budget — so it is past the point where its schedule should have started it at least once. If ensure-containers recreated it, the schedule that should start it may not be firing."

  # ---------------------------------------------------------------------------
  # TextfileCollectorStale
  #
  # The 1h catch-all against a collector that legitimately writes once a day. The exclusion is
  # the fix; the second case proves the catch-all still covers everything else.
  # ---------------------------------------------------------------------------
  - interval: 1m
    name: daily reauth reminder file is excluded from the 1h catch-all
    input_series:
      - series: 'node_textfile_mtime_seconds{file="/textfile_collector/nh22_cdbaby_reauth_reminder.prom",instance="nodeexporter:9100"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: TextfileCollectorStale
        exp_alerts: []

  - interval: 1m
    name: an unrecognised collector going stale is still caught
    input_series:
      - series: 'node_textfile_mtime_seconds{file="/textfile_collector/watchtower.prom",instance="nodeexporter:9100"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 4h
        alertname: TextfileCollectorStale
        exp_alerts:
          - exp_labels:
              severity: warning
              file: /textfile_collector/watchtower.prom
              instance: nodeexporter:9100
            exp_annotations:
              summary: "Textfile collector /textfile_collector/watchtower.prom has stopped updating"
              description: "/textfile_collector/watchtower.prom has not been written in over an hour. Its metrics are frozen at their last values rather than absent, so they will look healthy."

  # ---------------------------------------------------------------------------
  # NH22PaymentDataStale
  #
  # The grain selector is exactly the kind of conjunct this file exists to protect: it
  # looks like a redundant label filter, and without it the rule fires forever on five
  # perfectly healthy month-grain datasets that legitimately sit at 17 days behind.
  # ---------------------------------------------------------------------------
  - interval: 1m
    name: payments fresh within the weekly cadence - must stay silent
    input_series:
      - series: 'nh22_ingest_dataset_days_behind{dataset="cdbaby_payments",grain="day",cadence="semi_automated"}'
        values: '6x200'
    alert_rule_test:
      - eval_time: 3h
        alertname: NH22PaymentDataStale
        exp_alerts: []

  - interval: 1m
    name: a month-grain dataset 17 days behind is HEALTHY - must stay silent
    input_series:
      # This is the real observed state of five datasets on 2026-08-18. A rule without
      # the grain="day" selector pages on every one of them, forever.
      - series: 'nh22_ingest_dataset_days_behind{dataset="cdbaby_partner_sales",grain="month",cadence="semi_automated"}'
        values: '17x200'
      - series: 'nh22_ingest_dataset_days_behind{dataset="discover_campaign",grain="month",cadence="automated"}'
        values: '17x200'
    alert_rule_test:
      - eval_time: 3h
        alertname: NH22PaymentDataStale
        exp_alerts: []

  - interval: 1m
    name: a missed weekly payment - must fire
    input_series:
      # 15 days behind: the real 2026-08-18 state, with the 2026-08-10 payment lost.
      - series: 'nh22_ingest_dataset_days_behind{dataset="cdbaby_payments",grain="day",cadence="semi_automated"}'
        values: '15x200'
    alert_rule_test:
      - eval_time: 3h
        alertname: NH22PaymentDataStale
        exp_alerts:
          - exp_labels:
              alertname: NH22PaymentDataStale
              dataset: cdbaby_payments
              grain: day
              cadence: daily
              severity: warning
              service: nh22-extractor
              kind: data
            exp_annotations:
              summary: "nh22 CD Baby payment data is 15 days behind"
              description: "The newest row in payments.raw_cdbaby_payments is 15 days old. Payments are dated weekly (Mondays), so more than ~8 days means at least one weekly payment was never captured. The crawl may still be completing and reporting success — payment history returning ZERO rows counts as a clean run, which is exactly how this went unnoticed for 15 days in August 2026."
              runbook: "Check the payment-history step in `docker logs nh22-analytics-extractor-cdbaby-1` — a 'payment history failed' line, or 'payment history scraped 0 row(s)' on a day a payment was due. The routine window is a trailing 30 days keyed on payment date, so any gap shorter than a month is recovered automatically by the next SUCCESSFUL run — if this is firing, the scrape itself is failing, or the gap is older than 30 days. For an older gap, widen it for one run: `docker compose run --rm -e NH22_SOURCES=cdbaby -e NH22_FORCE=true -e NH22_CDBABY_PAYMENTS_TRAILING_DAYS=90 extractor`. Verify with `select max(dt) from payments.raw_cdbaby_payments;`."

  # ---------------------------------------------------------------------------
  # NH22IngestFreshnessExportStale
  #
  # The disarm-detector for the rule above. `> 8` cannot match an absent series, so a
  # dead exporter makes missing payment data look exactly like healthy payment data.
  # ---------------------------------------------------------------------------
  - interval: 1m
    name: exporter writing on schedule - must stay silent
    input_series:
      - series: 'nh22_ingest_freshness_export_timestamp'
        # promtool's clock starts at 0, so a timestamp tracking "now" keeps the age small.
        values: '0+60x200'
    alert_rule_test:
      - eval_time: 2h
        alertname: NH22IngestFreshnessExportStale
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # NH22CdbabyKeepaliveStalled
  #
  # The threshold here is COUPLED to keepalive-cdbaby's ofelia schedule, and nothing
  # enforces that coupling but this test. On 2026-08-18 the cadence was slowed
  # 10m -> 30m (it had been sized against a "~20-minute cdb.auth" reading that was
  # later retracted; the real credential is ~30 days), and the threshold had to move
  # 2400s -> 5400s with it. Left at 2400s it would have fired on a perfectly healthy
  # keepalive after a single missed tick — and while it fires, NH22CdbabySessionDead
  # is DISARMED, so the noise would also have hidden a real dead session.
  #
  # Both directions asserted: silent at the new cadence, still catching a genuine stall.
  # ---------------------------------------------------------------------------
  - interval: 1m
    name: cdbaby keepalive ticking every 30m, with one missed tick - must stay silent
    input_series:
      # The timestamp holds between ticks and jumps to "now" on each one; promtool's
      # clock starts at 0, so tracking it keeps the age realistic.
      #
      # A MISSED TICK IS THE WHOLE POINT of this case. A series that ticks perfectly
      # every 30m peaks at only ~1800s of age, which is under BOTH the old 2400s
      # threshold and the new 5400s one — so it passes either way and proves nothing.
      # (Checked: the first version of this test did exactly that.) One skipped tick
      # takes the peak age to ~3600s, which is above 2400 and below 5400, and that is
      # what makes this test discriminate. It is also realistic: keepalive-cdbaby
      # skips its tick outright whenever a crawl holds the scrape lock.
      # EVAL TIME MATTERS AS MUCH AS THE SERIES. promtool evaluates only at the
      # instant named, so evaluating after the keepalive recovers proves nothing —
      # the alert has already cleared and the test passes at any threshold. 88m is
      # inside the gap: the last tick was at 30m (t=1800s), so the age is ~3480s,
      # which is above the OLD 2400s threshold (and has been for 18m, clearing the
      # `for: 15m` debounce) and below the new 5400s one.
      - series: 'nh22_cdbaby_session_last_check_timestamp'
        #        t=0..29 -> 0     t=30..89 -> 1800 (the t=60 tick never happened)
        values: '0x29 1800x59 5400x59'
    alert_rule_test:
      - eval_time: 88m
        alertname: NH22CdbabyKeepaliveStalled
        exp_alerts: []

  - interval: 1m
    name: cdbaby keepalive genuinely stopped - must still fire
    input_series:
      # One tick at t=0 and then nothing ever again.
      - series: 'nh22_cdbaby_session_last_check_timestamp'
        values: '0x300'
    alert_rule_test:
      - eval_time: 3h
        alertname: NH22CdbabyKeepaliveStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              service: nh22-extractor
              kind: error
            exp_annotations:
              summary: "nh22 cdbaby keepalive has stopped checking"
              description: "No CD Baby session check in over 90 minutes (it runs every 30 — slowed from every 10 on 2026-08-18, which is why this threshold moved from 2400s to 5400s; both are 3 missed ticks). NH22CdbabySessionDead is gated on nh22_cdbaby_session_valid and is therefore DISARMED while this fires — a dead CD Baby session will not page until this is fixed."
              runbook: "`docker logs nh22-analytics-keepalive-cdbaby-1`. If the container is missing, ensure-containers recreates it at :05; if ofelia itself is down, SchedulerDaemonDown will be firing too. Until this clears, check CD Baby auth by hand: `docker compose run --rm extractor node src/run.mjs --sources cdbaby --dry-run` or just watch for the 06:20/09:20 crawl's own AUTH_REQUIRED log line."

  # ---------------------------------------------------------------------------
  # SparkyActivityPush* (garmin-jobs activity pusher) — all four, both directions
  #
  # Four rules cover one daemon and the whole point is that each catches a state the others
  # cannot see. That is exactly the shape that looks redundant later and gets consolidated, so
  # every case below names which rules must be SILENT as well as which must fire — a set of
  # tests asserting only the firing rule would be passed perfectly by a rule that had swallowed
  # its neighbour's job and lost the distinction.
  #
  # Series shape: `0+60x150` advances the mtime by 60 every minute, i.e. a file always ~0s old.
  # Freezing the value is how a stopped writer is modelled. promtool's clock starts at epoch 0,
  # so `time() - value` is a real age.
  # ---------------------------------------------------------------------------
  - interval: 1m
    name: pusher healthy, cycling every 5m - all four must stay silent
    input_series:
      - series: 'node_textfile_mtime_seconds{instance="mozart:9100",file="/textfile/sparky_activity_push.prom"}'
        values: '0+60x150'
      - series: 'sparky_activity_push_last_success_timestamp_seconds{instance="mozart:9100",service="garmin-jobs"}'
        values: '0+60x150'
    alert_rule_test:
      - eval_time: 2h
        alertname: SparkyActivityPushFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: SparkyActivityPushGone
        exp_alerts: []
      - eval_time: 2h
        alertname: SparkyActivityPushHeartbeatMissing
        exp_alerts: []
      - eval_time: 2h
        alertname: SparkyActivityPushNeverSucceeded
        exp_alerts: []

  - interval: 1m
    name: pusher up and failing - Failing fires, Gone must not
    input_series:
      # The file keeps being rewritten every cycle; the success value froze at t=0. This is the
      # shape an expired Garmin login produces, and it is ONLY distinguishable from a dead
      # daemon because the pusher keeps publishing while parked.
      - series: 'node_textfile_mtime_seconds{instance="mozart:9100",file="/textfile/sparky_activity_push.prom"}'
        values: '0+60x150'
      - series: 'sparky_activity_push_last_success_timestamp_seconds{instance="mozart:9100",service="garmin-jobs"}'
        values: '0x150'
    alert_rule_test:
      - eval_time: 2h
        alertname: SparkyActivityPushGone
        exp_alerts: []
      - eval_time: 2h
        alertname: SparkyActivityPushNeverSucceeded
        exp_alerts: []
      - eval_time: 2h
        alertname: SparkyActivityPushFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: garmin-jobs
              instance: mozart:9100
            exp_annotations:
              summary: "SparkyFitness activity push has not succeeded in 30 minutes"
              description: "The pusher is running and writing its heartbeat, but no cycle has completed successfully for over 30 minutes, so SparkyFitness's active-calorie rows are going stale. TODAY's row still self-heals -- Sparky's connector rewrites today hourly -- but a day that CLOSES while this is firing stays wrong permanently: the scheduled sync uses a single-day window (startDate = endDate = today in services/garminService.ts), so nothing ever revisits a closed day. Measured 2026-09-25. Check `make pusher-logs` for a Garmin rate-limit or an expired login."
              runbook: "`make pusher-logs` in ~/src/garmin-jobs. An expired Garmin login logs `parking the login` and needs `make bootstrap` (interactive, handles MFA) -- the daemon heals itself within the hour once that has run. A 429 logs `rate-limited` and needs nothing. Sparky refusing the write logs the HTTP status; check `docker compose ps` in ~/src/SparkyFitness. `sparky_activity_push_garmin_last_sync_timestamp_seconds` going stale too means the WATCH has not synced, which no amount of restarting here will fix."

  - interval: 1m
    name: pusher dead - Gone fires, Failing must not, and the catch-all must stay out of it
    input_series:
      # Everything frozen at t=0: the container stopped and LEFT ITS FILE BEHIND, which is why
      # absent() cannot be the rule for this case. TextfileCollectorStale is asserted silent
      # here because its exclusion list and these rules are one unit — without the exclusion this
      # single fault raises three alerts.
      - series: 'node_textfile_mtime_seconds{instance="mozart:9100",file="/textfile/sparky_activity_push.prom"}'
        values: '0x150'
      - series: 'sparky_activity_push_last_success_timestamp_seconds{instance="mozart:9100",service="garmin-jobs"}'
        values: '0x150'
    alert_rule_test:
      - eval_time: 2h
        alertname: SparkyActivityPushFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: TextfileCollectorStale
        exp_alerts: []
      - eval_time: 2h
        alertname: SparkyActivityPushGone
        exp_alerts:
          - exp_labels:
              severity: warning
              service: garmin-jobs
              instance: mozart:9100
              file: /textfile/sparky_activity_push.prom
            exp_annotations:
              summary: "SparkyFitness activity pusher has stopped writing its heartbeat"
              description: "Nothing has rewritten sparky_activity_push.prom in over 30 minutes, so the pusher is not running -- crashed, stopped, or never started. Note its metrics are FROZEN rather than absent, so every value in them still looks healthy. Check `docker compose ps pusher`."
              runbook: "`docker compose ps -a pusher` then `make pusher-logs` in ~/src/garmin-jobs. A container in `created` state has never been started -- that is Ofelia's ensure-containers having manufactured it, and `make up` fixes it. Exited: read the logs, the daemon only exits on SIGTERM. Absent entirely: `make up`, and check `pusher` is in the Makefile's DAEMONS."

  # THE HANDOVER. A daemon that fails for an hour and THEN dies is the one case where the two
  # rules swap, and with equal 1800s thresholds there was a five-minute hole in the middle of the
  # swap: Failing stopped matching the instant the mtime crossed 1800 while Gone still owed its
  # `for: 5m`, so Alertmanager sent RESOLVED for a fault that had just got worse. Failing's guard
  # is 2100 (one cycle wider) to overlap instead. Both instants below are asserted because the
  # gap only exists between them.
  - interval: 1m
    name: pusher failed for an hour then died - coverage must not lapse across the handover
    input_series:
      # Fresh for 60 minutes, then frozen at 3600. mtime age crosses 1800 at t=90m, Gone's 2m hold
      # completes at t=92m, and Failing's 2000s guard closes at t=93m20s. The overlap is 92m..93m20s
      # -- narrow on purpose, and the whole point: Gone is already firing before Failing lets go.
      - series: 'node_textfile_mtime_seconds{instance="mozart:9100",file="/textfile/sparky_activity_push.prom"}'
        values: '0+60x59 3600x200'
      - series: 'sparky_activity_push_last_success_timestamp_seconds{instance="mozart:9100",service="garmin-jobs"}'
        values: '0x260'
    alert_rule_test:
      # t=93m: inside the OVERLAP. mtime age is 1980 -- under Failing's 2000 guard, and past Gone's
      # 1800 + 2m hold. BOTH must be firing here; that overlap is what makes the handover seamless.
      - eval_time: 93m
        alertname: SparkyActivityPushFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: garmin-jobs
              instance: mozart:9100
            exp_annotations:
              summary: "SparkyFitness activity push has not succeeded in 30 minutes"
              description: "The pusher is running and writing its heartbeat, but no cycle has completed successfully for over 30 minutes, so SparkyFitness's active-calorie rows are going stale. TODAY's row still self-heals -- Sparky's connector rewrites today hourly -- but a day that CLOSES while this is firing stays wrong permanently: the scheduled sync uses a single-day window (startDate = endDate = today in services/garminService.ts), so nothing ever revisits a closed day. Measured 2026-09-25. Check `make pusher-logs` for a Garmin rate-limit or an expired login."
              runbook: "`make pusher-logs` in ~/src/garmin-jobs. An expired Garmin login logs `parking the login` and needs `make bootstrap` (interactive, handles MFA) -- the daemon heals itself within the hour once that has run. A 429 logs `rate-limited` and needs nothing. Sparky refusing the write logs the HTTP status; check `docker compose ps` in ~/src/SparkyFitness. `sparky_activity_push_garmin_last_sync_timestamp_seconds` going stale too means the WATCH has not synced, which no amount of restarting here will fix."
      # ...and Gone is ALREADY firing at the same instant. This assertion is the overlap itself:
      # without it the suite would pass with a gap, which is exactly how the 2100/5m version slipped
      # through and had to be caught by a live drill instead.
      - eval_time: 93m
        alertname: SparkyActivityPushGone
        exp_alerts:
          - exp_labels:
              severity: warning
              service: garmin-jobs
              instance: mozart:9100
              file: /textfile/sparky_activity_push.prom
            exp_annotations:
              summary: "SparkyFitness activity pusher has stopped writing its heartbeat"
              description: "Nothing has rewritten sparky_activity_push.prom in over 30 minutes, so the pusher is not running -- crashed, stopped, or never started. Note its metrics are FROZEN rather than absent, so every value in them still looks healthy. Check `docker compose ps pusher`."
              runbook: "`docker compose ps -a pusher` then `make pusher-logs` in ~/src/garmin-jobs. A container in `created` state has never been started -- that is Ofelia's ensure-containers having manufactured it, and `make up` fixes it. Exited: read the logs, the daemon only exits on SIGTERM. Absent entirely: `make up`, and check `pusher` is in the Makefile's DAEMONS."
      # t=95m: mtime age 2100, past Failing's guard. Gone alone. One fault, one alert, no lapse.
      - eval_time: 95m
        alertname: SparkyActivityPushFailing
        exp_alerts: []
      - eval_time: 95m
        alertname: SparkyActivityPushGone
        exp_alerts:
          - exp_labels:
              severity: warning
              service: garmin-jobs
              instance: mozart:9100
              file: /textfile/sparky_activity_push.prom
            exp_annotations:
              summary: "SparkyFitness activity pusher has stopped writing its heartbeat"
              description: "Nothing has rewritten sparky_activity_push.prom in over 30 minutes, so the pusher is not running -- crashed, stopped, or never started. Note its metrics are FROZEN rather than absent, so every value in them still looks healthy. Check `docker compose ps pusher`."
              runbook: "`docker compose ps -a pusher` then `make pusher-logs` in ~/src/garmin-jobs. A container in `created` state has never been started -- that is Ofelia's ensure-containers having manufactured it, and `make up` fixes it. Exited: read the logs, the daemon only exits on SIGTERM. Absent entirely: `make up`, and check `pusher` is in the Makefile's DAEMONS."

  - interval: 1m
    name: pusher writing but never once successful - NeverSucceeded fires, Failing cannot
    input_series:
      # NO success series at all. The heartbeat omits that line until the first success rather
      # than publishing epoch 0, so Failing's first conjunct matches nothing and is silent
      # FOREVER in this state — which is the entire reason this rule exists.
      - series: 'node_textfile_mtime_seconds{instance="mozart:9100",file="/textfile/sparky_activity_push.prom"}'
        values: '0+60x150'
    alert_rule_test:
      - eval_time: 2h
        alertname: SparkyActivityPushFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: SparkyActivityPushGone
        exp_alerts: []
      - eval_time: 2h
        alertname: SparkyActivityPushHeartbeatMissing
        exp_alerts: []
      - eval_time: 2h
        alertname: SparkyActivityPushNeverSucceeded
        exp_alerts:
          - exp_labels:
              severity: warning
              service: garmin-jobs
            exp_annotations:
              summary: "SparkyFitness activity pusher has never completed a successful cycle"
              description: "The pusher is writing its heartbeat but has never once succeeded, so it has been failing since the moment it started. Expect a first deploy that cannot reach SparkyFitness or Garmin at all -- a missing SPARKY_API_KEY, the wrong network, or a token store that was never bootstrapped."
              runbook: "`make pusher-logs` in ~/src/garmin-jobs; every cycle logs its reason. `make pusher-dry` prints what it would send and whether the key is configured, and runs on the pusher's own service so it inherits the same networks and mounts."

  - interval: 1m
    name: heartbeat series never appeared at all - Missing fires and the other three are blind
    input_series:
      # No mtime series whatsoever: the file was never written, the bind mount points somewhere
      # node_exporter does not read, or the file is unparseable and node_exporter skipped it
      # whole. The three rules that compare against that series can only be silent, which is why
      # this one is not redundant with Gone.
      - series: 'node_textfile_mtime_seconds{instance="mozart:9100",file="/textfile/zfs-metrics.prom"}'
        values: '0+60x150'
    alert_rule_test:
      - eval_time: 2h
        alertname: SparkyActivityPushFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: SparkyActivityPushGone
        exp_alerts: []
      - eval_time: 2h
        alertname: SparkyActivityPushNeverSucceeded
        exp_alerts: []
      - eval_time: 2h
        alertname: SparkyActivityPushHeartbeatMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              service: garmin-jobs
            exp_annotations:
              summary: "SparkyFitness activity pusher heartbeat has never appeared"
              description: "node_exporter is publishing no mtime for sparky_activity_push.prom, so the file has never been written, the bind mount does not point at the directory node_exporter reads, or the file is unparseable and node_exporter is skipping it whole. SparkyActivityPushFailing and SparkyActivityPushGone are both BLIND in this state -- they compare against a series that does not exist."
              runbook: "Check the file is where both sides think it is: `ls -l ~/src/dockprom/textfile_collector/sparky_activity_push.prom` and that the pusher's `/textfile` mount resolves to that same directory (`docker inspect` the mount source, or TEXTFILE_COLLECTOR_DIR in garmin-jobs' environment file). If the file is present and recent, it is unparseable -- see TextfileCollectorUnparseable and `promtool check metrics < the file`."

  # ---------------------------------------------------------------------------
  # TextfileCollectorUnparseable
  #
  # node_exporter's own verdict. Both directions, because 0 is the value on every healthy scrape
  # and a rule written `>= 0` or on `absent()` would page continuously.
  # ---------------------------------------------------------------------------
  - interval: 1m
    name: every textfile parsed cleanly - must stay silent
    input_series:
      - series: 'node_textfile_scrape_error{instance="mozart:9100"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: TextfileCollectorUnparseable
        exp_alerts: []

  - interval: 1m
    name: a textfile will not parse - must fire
    input_series:
      - series: 'node_textfile_scrape_error{instance="mozart:9100"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: TextfileCollectorUnparseable
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: mozart:9100
            exp_annotations:
              summary: "node_exporter cannot parse a file in its textfile directory"
              description: "node_exporter reported a textfile parse error. It SKIPS the offending file whole, so that writer's metrics are absent rather than stale and every freshness rule for them is blind -- including the Sparky and ZFS rules in this group."
              runbook: "`ls -lt ~/src/dockprom/textfile_collector/` — the newest file is the suspect. `promtool check metrics < <file>` names the bad line. Also look for leftover *.tmp files: a writer that died mid-publish leaves one, and a .prom-suffixed temp name would be read as a real file."

  # ---------------------------------------------------------------------------
  # THE ZERO-MARGIN REGRESSION. Found by a live drill on 2026-09-25, not by this suite.
  #
  # Failing's condition window is (guard - 1800) + LAG, where LAG is how much older `last_success` is
  # than the file's mtime. It fires when that exceeds its 300s hold. So the guard buys tolerance:
  #
  #     guard 2100  ->  window = 300 + LAG   ->  fires on ANY lag at all
  #     guard 2000  ->  window = 200 + LAG   ->  fires only once lag exceeds 100s
  #
  # With a perfectly healthy daemon LAG is ~0 and both settings behave, which is why the drill still
  # produced the right answer and why the first version of this test could not tell them apart: it
  # modelled success and mtime freezing together, the one case where the margin is invisible. Then
  # Failing merely went pending and dropped at the exact second Gone fired -- correct by a tie.
  #
  # LAG is not hypothetical. `last_success` is stamped at cycle COMPLETION and the heartbeat is
  # written on EVERY cycle including failing ones, so any daemon that fails a cycle and then dies has
  # a real lag. 120s here: two failed cycles before the container went.
  #
  # 120s AND NOT 60s, and the difference is the discrete evaluation grid rather than the arithmetic.
  # On continuous time a 60s lag separates the two settings; evaluated once a minute the condition
  # starts one tick late and the guard closes one tick early, which collapses 60s back into a tie.
  # Simulated across the grid before picking: at 60s neither fires, at 120s only the 2100 guard does,
  # at 180s both do. 120s is the only value that isolates the change, and finding that required
  # modelling how Prometheus actually evaluates rather than how the inequality reads.
  # ---------------------------------------------------------------------------
  - interval: 1m
    name: dead container whose last cycle lagged - Failing must NOT fire alongside Gone
    input_series:
      # mtime advances for two minutes then freezes at 120; success is frozen at 0. LAG = 120s.
      - series: 'node_textfile_mtime_seconds{instance="mozart:9100",file="/textfile/sparky_activity_push.prom"}'
        values: '0+60x2 120x200'
      - series: 'sparky_activity_push_last_success_timestamp_seconds{instance="mozart:9100",service="garmin-jobs"}'
        values: '0x220'
    alert_rule_test:
      # t=36m: mtime age 2040. Under the old 2100 guard this is the exact tick where Failing's 300s
      # hold completes while its condition is still true -- it WOULD fire, giving two alerts for one
      # dead container. Under 2000 the condition went false a tick earlier and it cannot.
      - eval_time: 36m
        alertname: SparkyActivityPushFailing
        exp_alerts: []
      # Gone has been firing since t=35m. The dead container is reported once, by the accurate rule.
      - eval_time: 36m
        alertname: SparkyActivityPushGone
        exp_alerts:
          - exp_labels:
              severity: warning
              service: garmin-jobs
              instance: mozart:9100
              file: /textfile/sparky_activity_push.prom
            exp_annotations:
              summary: "SparkyFitness activity pusher has stopped writing its heartbeat"
              description: "Nothing has rewritten sparky_activity_push.prom in over 30 minutes, so the pusher is not running -- crashed, stopped, or never started. Note its metrics are FROZEN rather than absent, so every value in them still looks healthy. Check `docker compose ps pusher`."
              runbook: "`docker compose ps -a pusher` then `make pusher-logs` in ~/src/garmin-jobs. A container in `created` state has never been started -- that is Ofelia's ensure-containers having manufactured it, and `make up` fixes it. Exited: read the logs, the daemon only exits on SIGTERM. Absent entirely: `make up`, and check `pusher` is in the Makefile's DAEMONS."

  # ---------------------------------------------------------------------------
  # GarminDeviceSyncStale / GarminDeviceSyncDead
  #
  # Two gates: the age thresholds (18h / 24h, from data -- 4h would page every night), and the
  # pusher-heartbeat guard that stops a DEAD pusher's frozen sync timestamp being reported as a
  # watch that has not synced. Series values are the TIMESTAMPS, so ages are set by eval_time.
  # ---------------------------------------------------------------------------
  - interval: 1m
    name: device synced 14h ago (normal morning peak) - must stay silent
    input_series:
      - series: 'sparky_activity_push_garmin_last_sync_timestamp_seconds{service="garmin-jobs"}'
        values: '0x1000'
      - series: 'node_textfile_mtime_seconds{file="/textfile_collector/sparky_activity_push.prom"}'
        values: '50400+60x1000'
    alert_rule_test:
      - eval_time: 840m
        alertname: GarminDeviceSyncStale
        exp_alerts: []

  - interval: 1m
    name: device last synced 19h ago with a live pusher - warning fires, critical does not
    input_series:
      - series: 'sparky_activity_push_garmin_last_sync_timestamp_seconds{service="garmin-jobs"}'
        values: '0x2000'
      - series: 'node_textfile_mtime_seconds{file="/textfile_collector/sparky_activity_push.prom"}'
        values: '0+60x2000'
    alert_rule_test:
      - eval_time: 1200m
        alertname: GarminDeviceSyncStale
        exp_alerts:
          - exp_labels:
              severity: warning
              service: garmin-jobs
            exp_annotations:
              summary: "Garmin watch has not synced in over 18 hours"
              description: "The Garmin device's last sync was more than 18 hours ago, while the pusher itself is running. Garmin returns empty days until the watch syncs, so Sparky's Burned figure and the Remaining calories derived from it are stale -- and SparkyActivityPushFailing / WritesNotLanding may fire as a SYMPTOM of this, not a fault in the write path. Normal peak is ~14.5h (morning wake-up)."
              runbook: "Open Garmin Connect on the phone and force a sync; check the watch is paired and Bluetooth is on. Nothing on mozart needs restarting. If the app syncs but this does not clear within the hour, check `sparky_activity_push_garmin_last_sync_timestamp_seconds` and `make pusher-logs` in ~/src/garmin-jobs."
      - eval_time: 1200m
        alertname: GarminDeviceSyncDead
        exp_alerts: []

  - interval: 1m
    name: device last synced 25h ago with a live pusher - critical fires
    input_series:
      - series: 'sparky_activity_push_garmin_last_sync_timestamp_seconds{service="garmin-jobs"}'
        values: '0x2000'
      - series: 'node_textfile_mtime_seconds{file="/textfile_collector/sparky_activity_push.prom"}'
        values: '0+60x2000'
    alert_rule_test:
      - eval_time: 1500m
        alertname: GarminDeviceSyncDead
        exp_alerts:
          - exp_labels:
              severity: critical
              service: garmin-jobs
            exp_annotations:
              summary: "Garmin watch has not synced in over 24 hours"
              description: "The Garmin device has not synced for more than a day. This does not happen without a real fault (dead battery, lost pairing, phone app logged out, watch left behind). Every day that closes in this state is wrong in Sparky until a backfill: the sync window is a single day and nothing revisits a closed day."
              runbook: "Get the watch syncing, then backfill the missed days -- see Runbook 6 6.8 (the 2026-10-16 gap). Do not restart containers; the write path is not the cause."

  - interval: 1m
    name: pusher dead (heartbeat file stale) so the sync timestamp is frozen - device rules stay silent
    input_series:
      - series: 'sparky_activity_push_garmin_last_sync_timestamp_seconds{service="garmin-jobs"}'
        values: '0x2000'
      - series: 'node_textfile_mtime_seconds{file="/textfile_collector/sparky_activity_push.prom"}'
        values: '0x2000'
    alert_rule_test:
      - eval_time: 1500m
        alertname: GarminDeviceSyncDead
        exp_alerts: []
      - eval_time: 1500m
        alertname: GarminDeviceSyncStale
        exp_alerts: []
