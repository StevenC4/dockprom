global:
  smtp_smarthost: 'smtpd:25'
  smtp_from: 'alertmanager@stevenc4.com'
  smtp_require_tls: false

route:
    group_by: ['alertname', 'hostname']
    group_interval: 2m
    group_wait: 30s
    receiver: 'email'
    repeat_interval: 2h
    routes:
      # The alerting pipeline itself. MUST go to email: these fire precisely when
      # Slack delivery is broken, so routing them to Slack would be a closed loop
      # that reports nothing. (On 2026-07-13 a 0600 webhook file the `nobody`
      # container user could not read silently dropped 9 days of nh22 alerts —
      # every notify failed, and nothing watched the notifier.)
      - matchers:
          - service="alerting"
        receiver: 'email'
        group_by: ['alertname', 'integration']
        repeat_interval: 6h

      # Scheduled-job liveness (oneshot-exporter): the arr/vpn stack goes to EMAIL, never
      # Slack — asked for explicitly.
      #
      # This route is technically redundant today: the top-level receiver is already 'email',
      # so anything without a matching route lands there anyway. It is written out regardless
      # so the choice is durable rather than incidental — if the default receiver is ever
      # changed to Slack, vpn-jobs keeps going to email instead of silently following it.
      #
      # The other *-jobs services (nh22-jobs, garmin-jobs, hopper-jobs, finance-jobs) have no
      # route and so also fall through to email. That is the conservative default, not a
      # considered decision per stack — add routes here if any of them should go to Slack.
      - matchers:
          - service="vpn-jobs"
        receiver: 'email'
        group_by: ['alertname', 'container']
        repeat_interval: 6h

      # NightHawk22 extractor: auth breakage -> email AND Slack; everything else
      # (data staleness, run errors) -> Slack.
      #
      # Auth was email-only until 2026-07-28, on the reasoning that it needs a
      # human at a keyboard. It still does — the email stays. But email-only left
      # a gap the extractor filled by posting to Slack directly from its own
      # webhook, bypassing this pipeline entirely: no ack button, no grouping, no
      # silence, no repeat_interval, and no self-monitoring. That direct path is
      # being removed from the extractor, so auth now routes here as well and
      # arrives as Cacau with the same Resolve button as every other alert.
      - matchers:
          - service="nh22-extractor"
        receiver: 'nh22-slack'
        group_by: ['alertname', 'source']
        routes:
          - matchers:
              - kind="auth"
            receiver: 'nh22-auth'
            repeat_interval: 1h

          # Data staleness repeats DAILY, not on the 2h global default.
          #
          # These two rules watch nh22_source_last_success_timestamp, which only moves
          # when a scheduled crawl completes. cdbaby crawls at 06:20 and retries at
          # 09:20 MT (ofelia.ini, extract-cdbaby / extract-cdbaby-retry) — so outside a
          # 3-hour morning window the input to this alert physically cannot change. At
          # the inherited 2h repeat that produced 12 identical Slack posts over the
          # 23.7h cdbaby was firing on 2026-08-08/09, of which 11 carried no information
          # that was not in the first.
          #
          # Both firings were TRUE — cdbaby really had lost >2 days of data to dead auth.
          # This is not a false positive being silenced; it is one true alert being
          # delivered once per opportunity to change instead of twelve times per day.
          #
          # NB repeat_interval is measured from the last notification, not the wall
          # clock, so the daily repeat lands at whatever time the alert first fired —
          # it is not guaranteed to arrive after the 09:20 retry. Once a day at an
          # arbitrary hour is the property being bought here, not a scheduled digest.
          #
          # This covers NH22DataStaleCritical (>3 days) as well as the >2 day warning.
          # Deliberate: the escalation reads the same gauge on the same cadence, so a
          # faster repeat there would be equally uninformative — a broken pipeline
          # needs a human, and nagging every 2h is what taught the reader to swipe
          # these away in the first place.
          - matchers:
              - kind="data"
            receiver: 'nh22-slack'
            repeat_interval: 24h

          # Anything whose INPUT can only move once a day repeats once a day.
          #
          # Generalises the kind="data" rule above. A rule opts in by carrying cadence=daily,
          # which is an assertion about the signal it reads: the job that writes it runs daily
          # or slower, so between those runs the alert physically cannot say anything new.
          # Repeating faster than the writer only reprints a value nobody has had the chance
          # to change. As of 2026-08-12 three rules opt in — NH22ExtractorRunError,
          # NH22ExtractorNotExtracting, NH22CdbabyReauthReminderStale.
          #
          # The label is OPT-IN, not opt-out, and that direction is the point: a new rule with
          # no cadence label falls through to the 2h default. Too noisy is recoverable, too
          # quiet is how the July 2026 outage ran for 9 days.
          #
          # Prompted by NH22ExtractorRunError[ascap] on 2026-08-11: one run failed on a
          # transient "token refresh unreachable", the last-run gauge stayed UNKNOWN for the
          # 23.9h until the next daily run, and the 2h default turned that into 12 identical
          # posts — 11 of which reported a value with no way to have moved.
          #
          # DELIBERATELY NOT matched on kind="error" wholesale, though that was the obvious
          # one-liner. Four of the seven kind=error rules read fast-moving signals and two of
          # those are load-bearing backstops that must stay loud:
          #   NH22CdbabyKeepaliveStalled  - while it fires, NH22CdbabySessionDead is DISARMED
          #                                 (gated on a gauge that has stopped being written),
          #                                 so CD Baby auth failures page nobody
          #   NH22AscapKeepaliveStalled   - same shape; the credential is unmonitored
          #   NH22ExtractorMetricsMissing - absent() over every source; any one of them writing
          #                                 clears it, and a total blackout is the worst moment
          #                                 to go quiet for a day
          #   NH22ExtractorNotRunning     - critical, and the detector for the exact 9-day
          #                                 July 2026 outage this stack exists to prevent
          # Those four keep the 2h default on purpose.
          - matchers:
              - cadence="daily"
            receiver: 'nh22-slack'
            repeat_interval: 24h

receivers:
  - name: 'email'
    email_configs:
    - to: 'stevencarroll90@gmail.com'
      from: 'alertmanager@stevenc4.com'
      smarthost: 'smtpd:25'

  # NightHawk22 data/error alerts -> #alerts, posted by Cacau via an
  # incoming webhook installed on that app. The channel is generic; the MESSAGE
  # carries the app identity, so a reader in #alerts can tell which app fired at
  # a glance. No `channel:` override — an incoming webhook is bound at install
  # time to the one channel it was installed to.
  #
  # Alertmanager's Slack integration speaks ONLY to incoming webhooks; it cannot
  # use a bot token. That is why this is a webhook and not chat.postMessage, and
  # why the app needs the `incoming-webhook` scope. Interposing a bot-token
  # bridge service here was considered and rejected: a container in the alerting
  # path is one more thing that can be pruned or crash and take the alerts down
  # with it — the exact failure this pipeline just suffered.
  - name: 'nh22-slack'
    slack_configs:
    # Webhook URL is read from a git-ignored file so the secret never enters git.
    # Create alertmanager/slack_webhook_url on the host with the hooks.slack.com URL.
    # It MUST be readable by uid 65534 (the container's `nobody`) — a 0600
    # steven-owned file silently broke every notify for 9 days in July 2026.
    - &nh22_slack_config
      api_url_file: '/etc/alertmanager/slack_webhook_url'
      send_resolved: true
      title: '{{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} NightHawk22 · {{ .CommonLabels.service }} — {{ .CommonLabels.alertname }}'
      # `<@UID>` is the escape form, which fires a real notification without
      # needing link_names. Mention on FIRING CRITICAL only — pinging on warnings
      # and on every resolve is how a mention gets tuned out.
      text: >-
        {{ if and (eq .Status "firing") (eq .CommonLabels.severity "critical") }}<@U0BGX8MV8EA> {{ end }}
        {{ range .Alerts }}*{{ .Labels.severity | toUpper }}* [{{ .Labels.source }}] {{ .Annotations.summary }}
        {{ .Annotations.description }}
        {{ if .Annotations.runbook }}*Runbook:* {{ .Annotations.runbook }}
        {{ end }}{{ end }}
      # A Resolve button on the post. Clicking it turns THIS post green and stamps who
      # cleared it — see dockprom/alert-ack. It is a Slack-side acknowledgement only and
      # changes nothing in Alertmanager: if the alert is still firing it will notify again
      # on repeat_interval as a new (red) post. That is the point — a green post means "a
      # human saw this one", never "the problem is gone".
      #
      # `callback_id` is the routing key: homelab-slack-gateway unicasts interactivity by
      # the namespace before the first ':' (see its config/routes.yaml), so `alert:` is
      # what steers the click to alert-ack. `actions[].name` is the verb within it.
      #
      # These are LEGACY attachment actions, not Block Kit. Alertmanager's Slack notifier
      # has no `blocks` field, and an attachment is in any case the only thing in Slack that
      # draws a coloured border — which is the whole ask. Note it renders on resolved posts
      # too: the list cannot be made conditional, and a template that rendered an empty
      # button text would make Slack reject the notify outright, which is a far worse
      # failure than a redundant button. Hence the conditional LABEL instead.
      callback_id: 'alert:{{ .CommonLabels.service }}'
      actions:
        - type: button
          name: 'alert:resolve'
          text: '{{ if eq .Status "firing" }}Mark resolved{{ else }}Acknowledge{{ end }}'
          # Log context only — alert-ack reads nothing from it. Keep it to fields that ALWAYS
          # exist: the Slack notifier renders `template.Data` (Status / CommonLabels / Alerts),
          # which has no .GroupKey, and a template that fails to evaluate cancels the whole
          # notify — the alert is then never delivered at all. Tried .GroupKey on 2026-07-23;
          # it took the notification down with "can't evaluate field GroupKey".
          value: '{{ .Status }}:{{ .CommonLabels.alertname }}'
          style: primary

  # Auth breakage: BOTH channels, on purpose.
  #
  # Re-auth needs a human at a keyboard, which is why this ever went to email —
  # that has not changed and the email stays. What changed is that email-only
  # left auth as the one nh22 alert absent from Slack, and the extractor filled
  # that gap by posting to Slack itself, out of band: no ack button, no grouping,
  # no silence, no repeat_interval, and nothing watching whether the post landed.
  # Routing auth here instead means it arrives as Cacau with the same Resolve
  # button as everything else, and the extractor's second delivery route can go.
  #
  # The slack_configs block is an alias of nh22-slack's, not a copy: two
  # divergent renderings of the same alert is how a template fix lands on one
  # channel and not the other.
  - name: 'nh22-auth'
    email_configs:
    - to: 'stevencarroll90@gmail.com'
      from: 'alertmanager@stevenc4.com'
      smarthost: 'smtpd:25'
    slack_configs:
    - *nh22_slack_config
