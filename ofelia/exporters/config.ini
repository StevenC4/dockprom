# No [global] save-folder here, and that is deliberate rather than an oversight. At @every 5s a
# persistently failing collector would write 3 report files every 5 seconds (~52k files/day) and
# Ofelia has no retention for that folder, so "save-only-on-error" is not a bound — it is a
# disk-fill risk that only triggers when something is already broken.
#
# The correct signal for a metrics collector is the metrics themselves going stale: if this job
# stops succeeding, the series it writes stop advancing, which is observable in Prometheus
# without Ofelia's help.
[job-exec "run-watchtower-metrics-collection"]
schedule = @every 5s
container = watchtower-metrics-collector
command = /scripts/gather-watchtower-metrics.sh
