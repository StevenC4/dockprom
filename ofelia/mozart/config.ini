# No [global] save-folder here, and that is deliberate rather than an oversight. At @every 15s
# a persistently failing collector would write 3 report files every 15 seconds (~17k files/day)
# and Ofelia has no retention for that folder, so "save-only-on-error" is not a bound — it is a
# disk-fill risk that only triggers when something is already broken.
#
# The correct signal for a metrics collector is the metrics themselves going stale: if this job
# stops succeeding, the zfs_* series it writes to the node_exporter textfile collector stop
# advancing, which is observable in Prometheus without Ofelia's help. See the alert rules in
# prometheus/mozart/alert.rules.
[job-exec "run-zfs-metrics-collection"]
schedule = @every 15s
container = zfs-utils
command = /scripts/gather-zfs-metrics.sh
